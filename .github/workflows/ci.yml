name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.9 is the stated minimum (README). 3.12 is what most people run.
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The same commands a user runs. quickstart.py makes .venv through
      # scripts/py, installs requirements.txt and solves the sample.
      - name: Quickstart
        run: python scripts/quickstart.py --no-open
      - name: Sample solve smoke test
        run: python scripts/py tests/smoke_test.py
      - name: PostCallMD bridge tests
        run: python scripts/py tests/test_postcallmd_bridge.py
      - name: Launcher tests
        run: python scripts/py tests/test_launcher.py
