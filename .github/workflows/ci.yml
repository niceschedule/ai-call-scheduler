name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.9 is the stated minimum (README). 3.12 is what most people run.
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The same commands a user runs. quickstart.py makes .venv through
      # scripts/py, installs requirements-dev.txt (requirements.txt plus
      # pytest) and solves the sample.
      - name: Quickstart
        run: python scripts/quickstart.py --no-open --dev
      - name: Tests
        run: python scripts/py -m pytest -v tests/
        env:
          # The Windows runner is slow enough that the sample solve can hit
          # the solver's 60-second limit before it proves the schedule is
          # the best one. See tests/smoke_test.py.
          SMOKE_ACCEPT_FEASIBLE: ${{ runner.os == 'Windows' && '1' || '' }}
